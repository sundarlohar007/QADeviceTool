name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    name: Build & Test
    runs-on: windows-latest

    env:
      Solution_Path: LogPro.sln

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        lfs: true

    - name: Install .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore
      run: dotnet restore ${{ env.Solution_Path }}

    - name: Build (Release)
      run: dotnet build ${{ env.Solution_Path }} -c Release --no-restore

    - name: Execute unit tests with coverage
      run: dotnet test src\LogPro.Tests\LogPro.Tests.csproj -c Release --no-build --collect:"XPlat Code Coverage"

    - name: Upload coverage
      uses: actions/upload-artifact@v7
      with:
        name: coverage
        path: src\LogPro.Tests\TestResults\**

  quality:
    name: Format & Audit
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore
      run: dotnet restore LogPro.sln

    - name: Format check
      run: dotnet format LogPro.sln --verify-no-changes --no-restore

    - name: NuGet vulnerability audit
      run: dotnet list LogPro.sln package --vulnerable --include-transitive