name: Build & Release

on:
  push:
    branches: [main, beta]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override (e.g. 3.2.1)'
        required: false

env:
  SOLUTION: LogPro.sln
  PROJECT: src/LogPro.App/LogPro.App.csproj
  TEST_PROJECT: src/LogPro.Tests/LogPro.Tests.csproj
  SETUP_SCRIPT: publish/setup.iss

permissions:
  contents: write
  actions: read

jobs:
  build:
    name: Publish
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.semver }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION }} -c Release --no-restore

      - name: Test
        run: dotnet test ${{ env.TEST_PROJECT }} -c Release --no-build --verbosity normal

      - name: Determine Version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "release") {
            $ver = "${{ github.event.release.tag_name }}" -replace '^v', ''
          } elseif ("${{ inputs.version }}") {
            $ver = "${{ inputs.version }}"
          } else {
            $ver = "3.2.${{ github.run_number }}"
          }
          echo "semver=$ver" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $ver"

      - name: Publish
        run: dotnet publish ${{ env.PROJECT }} -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o publish/app
      - name: Upload App
        uses: actions/upload-artifact@v4
        with:
          name: app-published
          path: publish/app/

  installer:
    name: Setup.exe
    needs: build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download App
        uses: actions/download-artifact@v4
        with:
          name: app-published
          path: publish/app/

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Inject Version & Compile
        shell: pwsh
        run: |
          $ver = "${{ needs.build.outputs.version }}"
          $iss = Get-Content "${{ env.SETUP_SCRIPT }}" -Raw
          $iss = $iss -replace '#define MyAppVersion "[^"]*"', "#define MyAppVersion `"$ver`""
          Set-Content "${{ env.SETUP_SCRIPT }}" -Value $iss
          Write-Host "Compiling installer for v$ver..."
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "${{ env.SETUP_SCRIPT }}"

      - name: Sign Setup.exe
        if: env.SIGN_CERT_PFX != '' && env.SIGN_CERT_PASSWORD != ''
        shell: pwsh
        env:
          SIGN_CERT_PFX: ${{ secrets.SIGN_CERT_PFX }}
          SIGN_CERT_PASSWORD: ${{ secrets.SIGN_CERT_PASSWORD }}
        run: |
          $cert = "$env:RUNNER_TEMP\signing.pfx"
          [IO.File]::WriteAllBytes($cert, [Convert]::FromBase64String($env:SIGN_CERT_PFX))
          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1).FullName
          $exe = Get-Item (Get-ChildItem dist\*.exe | Select-Object -First 1).FullName
          & $signtool sign /fd SHA256 /f $cert /p $env:SIGN_CERT_PASSWORD /t http://timestamp.digicert.com $exe.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Setup.exe
        uses: actions/upload-artifact@v4
        with:
          name: setup-exe
          path: dist/*.exe

  portable:
    name: Portable.zip
    needs: build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download App
        uses: actions/download-artifact@v4
        with:
          name: app-published
          path: publish/app/

      - name: Create Portable Archive
        shell: pwsh
        run: |
          $ver = "${{ needs.build.outputs.version }}"
          New-Item -ItemType Directory -Force -Path dist
          $zipName = "LogPro_v${ver}_portable.zip"
          Compress-Archive -Path publish/app/* -DestinationPath dist/$zipName
          Write-Host "Created: dist/$zipName"

      - name: Upload Portable.zip
        uses: actions/upload-artifact@v4
        with:
          name: portable-zip
          path: dist/*.zip

  release:
    name: GitHub Release
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    needs: [installer, portable]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Flatten Artifacts
        shell: bash
        run: |
          find dist/ -type f \( -name '*.exe' -o -name '*.zip' \) -exec mv {} dist/ \;
          rm -rf dist/setup-exe dist/portable-zip dist/app-published
          echo "=== Release Assets ==="
          ls -la dist/

      - name: Generate Changelog
        shell: bash
        run: |
          PREV=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          echo "## LogPro v${{ needs.build.outputs.version }}" > CHANGELOG.md
          echo "" >> CHANGELOG.md
          if [ -n "$PREV" ]; then
            git log "$PREV..HEAD" --pretty=format:"- %s" --no-merges >> CHANGELOG.md
          else
            git log --pretty=format:"- %s" --no-merges >> CHANGELOG.md
          fi
          cat CHANGELOG.md

      - name: Upload to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto-tag (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          VER="${{ needs.build.outputs.version }}"
          git tag -a "v$VER" -m "Release v$VER"
          git push origin "v$VER"