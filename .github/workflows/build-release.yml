name: Build & Release

on:
  push:
    branches: [main, beta]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override (e.g. 3.2.1)'
        required: false

env:
  SOLUTION: LogPro.sln
  PROJECT: src/LogPro.App/LogPro.App.csproj
  TEST_PROJECT: src/LogPro.Tests/LogPro.Tests.csproj
  SETUP_SCRIPT: publish/setup.iss

permissions:
  contents: write
  actions: read

jobs:
  build:
    name: Publish
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.semver }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION }} -c Release --no-restore

      - name: Test
        run: dotnet test ${{ env.TEST_PROJECT }} -c Release --no-build --verbosity normal

      - name: Determine Version
        id: version
        shell: pwsh
        env:
          VERSION_OVERRIDE: ${{ inputs.version }}
        run: |
          if ($env:VERSION_OVERRIDE) {
            if ($env:VERSION_OVERRIDE -notmatch '^\d+\.\d+\.\d+$') {
              throw "Version override must be strict semver, for example 3.2.115."
            }
            $ver = $env:VERSION_OVERRIDE
          } else {
            $ver = "3.2.${{ github.run_number }}"
          }
          echo "semver=$ver" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $ver"

      - name: Setup Python runtime builder
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Build complete iOS runtime
        shell: pwsh
        run: |
          python -m pip install -r scripts/requirements-pymobiledevice3-build.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pymobiledevice3 --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/build-pymobiledevice3.ps1
          Invoke-WebRequest -Uri "https://dl.google.com/android/repository/platform-tools-latest-windows.zip" -OutFile "$env:RUNNER_TEMP/platform-tools.zip"

      - name: Build Android inventory helper
        shell: pwsh
        run: |
          & "$env:ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager.bat" "platforms;android-34" "build-tools;35.0.0"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/build-android-helper.ps1

      - name: Publish App
        run: dotnet publish ${{ env.PROJECT }} -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:Version=${{ steps.version.outputs.semver }} -o publish/app

      - name: Prepare complete Windows tool payload
        shell: pwsh
        run: ./scripts/prepare-windows-tools.ps1 -PublishDirectory publish/app -AdbArchive "$env:RUNNER_TEMP/platform-tools.zip"

      - name: Validate Windows package entry point
        shell: pwsh
        run: |
          $exe = Join-Path "publish/app" "LogPro.exe"
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            throw "Windows publish did not produce LogPro.exe. Check LogPro.App.csproj AssemblyName."
          }

          $setup = Get-Content -LiteralPath $env:SETUP_SCRIPT -Raw
          if ($setup -notmatch '(?m)^#define MyAppExeName "LogPro\.exe"\s*$') {
            throw "publish/setup.iss must launch LogPro.exe, the published Windows entry point."
          }
          if ($setup -match 'QADeviceTool\.exe') {
            throw "publish/setup.iss contains the stale QADeviceTool.exe entry point."
          }

      - name: Prepare Windows app package
        shell: pwsh
        run: |
          function Test-ToolsManifest([string] $toolsRoot, [string] $manifestPath) {
            if (-not (Test-Path -LiteralPath $toolsRoot -PathType Container)) {
              throw "Bundled tools directory is missing: $toolsRoot"
            }
            $files = @(Get-ChildItem -LiteralPath $toolsRoot -File -Recurse)
            if ($files.Count -eq 0) { throw "Bundled tools directory is empty: $toolsRoot" }
            foreach ($file in $files) {
              $firstLine = Get-Content -LiteralPath $file.FullName -TotalCount 1 -ErrorAction SilentlyContinue
              if ($firstLine -eq "version https://git-lfs.github.com/spec/v1") {
                throw "Git LFS pointer was packaged instead of the real tool: $($file.FullName)"
              }
            }
            foreach ($name in @("adb.exe", "scrcpy.exe", "pymobiledevice3.exe")) {
              if (-not (Get-ChildItem -LiteralPath $toolsRoot -File -Recurse -Filter $name)) {
                throw "Required bundled tool is missing: $name"
              }
            }
            if (-not (Test-Path -LiteralPath $manifestPath -PathType Leaf)) {
              throw "Bundled tools manifest is missing: $manifestPath"
            }

            $root = (Resolve-Path -LiteralPath $toolsRoot).Path
            $entries = @(Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json)
            $expected = @{}
            foreach ($entry in $entries) {
              if ($expected.ContainsKey($entry.path)) { throw "Duplicate path in tools manifest: $($entry.path)" }
              $expected[$entry.path] = $entry.sha256.ToLowerInvariant()
            }
            $seen = @{}
            foreach ($file in $files) {
              $relative = $file.FullName.Substring($root.Length + 1).Replace('\', '/')
              $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              if (-not $expected.ContainsKey($relative)) { throw "Unlisted bundled tool file: $relative" }
              if ($expected[$relative] -ne $hash) { throw "Bundled tool hash mismatch: $relative" }
              $seen[$relative] = $true
            }
            if ($seen.Count -ne $expected.Count) { throw "Tools manifest contains missing files." }
          }

          foreach ($notice in @("LogPro-LICENSE.txt", "LogPro-SECURITY.md", "LogPro-GPL_COMPLIANCE.md", "LogPro-THIRD_PARTY_NOTICES.txt", "SOURCE-OFFER-pymobiledevice3.txt")) {
            if (-not (Test-Path -LiteralPath "publish/app/licenses/$notice" -PathType Leaf)) {
              throw "Windows app package is missing legal notice: $notice"
            }
          }
          Test-ToolsManifest "publish/app/tools" "publish/app/tools-manifest.json"

      - name: Remove debug symbols from release payloads
        shell: pwsh
        run: |
          Get-ChildItem publish/app -File -Filter *.pdb | Remove-Item -Force

      - name: Upload App
        uses: actions/upload-artifact@v7
        with:
          name: app-published
          path: publish/app/
          include-hidden-files: true

  installer:
    name: Setup.exe
    needs: build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download App
        uses: actions/download-artifact@v8
        with:
          name: app-published
          path: publish/app/

      - name: Validate installer input
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath "publish/app/LogPro.exe" -PathType Leaf)) {
            throw "Installer input is missing publish/app/LogPro.exe."
          }
          if (-not (Test-Path -LiteralPath "publish/app/tools-manifest.json" -PathType Leaf)) {
            throw "Installer input is missing the bundled-tools integrity manifest."
          }

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Inject Version & Compile
        shell: pwsh
        run: |
          $ver = "${{ needs.build.outputs.version }}"
          $iss = Get-Content "${{ env.SETUP_SCRIPT }}" -Raw
          $iss = $iss -replace '#define MyAppVersion "[^"]*"', "#define MyAppVersion `"$ver`""
          Set-Content "${{ env.SETUP_SCRIPT }}" -Value $iss
          Write-Host "Compiling installer for v$ver..."
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "${{ env.SETUP_SCRIPT }}"
          $expected = "dist/LogPro_v$ver.exe"
          if (-not (Test-Path -LiteralPath $expected -PathType Leaf)) {
            throw "Inno Setup did not produce the expected installer: $expected"
          }

      - name: Smoke test installed Windows package
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP "LogPro Installer Smoke"
          $setup = (Get-ChildItem dist/LogPro_v*.exe | Select-Object -First 1).FullName
          $installer = Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SKIPUPDATECHECK', "/DIR=`"$target`"") -WindowStyle Hidden -Wait -PassThru
          if ($installer.ExitCode -ne 0) { throw "Installer failed: $($installer.ExitCode)" }
          $verify = Start-Process -FilePath (Join-Path $target "LogPro.exe") -ArgumentList '--verify-installation' -WindowStyle Hidden -Wait -PassThru
          if ($verify.ExitCode -ne 0) { throw "Installed payload verification failed" }
          ./scripts/test-pymobiledevice3.ps1 -Executable (Join-Path $target "tools/pymobiledevice3/pymobiledevice3.exe")
          & (Join-Path $target "tools/adb/adb.exe") version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & (Join-Path $target "tools/scrcpy/scrcpy.exe") --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # A second install must replace the old program while retaining local data.
          $leftover = Join-Path $target "user-leftover.txt"
          Set-Content -LiteralPath $leftover -Value "preserve me"
          $userData = Join-Path $env:LOCALAPPDATA "LogPro/installer-smoke-user-data.txt"
          New-Item -ItemType Directory -Path (Split-Path $userData) -Force | Out-Null
          Set-Content -LiteralPath $userData -Value "user settings survive"
          Remove-Item -LiteralPath (Join-Path $target 'LogPro.exe') -Force
          $second = Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SKIPUPDATECHECK', "/DIR=`"$target`"") -WindowStyle Hidden -Wait -PassThru
          if ($second.ExitCode -ne 0) { throw "Clean replacement install failed: $($second.ExitCode)" }
          if (Test-Path -LiteralPath $leftover) { throw "Old program directory was not cleaned" }
          if ((Get-Content -LiteralPath $userData -Raw).Trim() -ne "user settings survive") { throw "User data was lost during replacement" }
          $recovered = @(Get-ChildItem (Join-Path $env:LOCALAPPDATA "LogPro/RecoveredInstallFiles") -Recurse -File -Filter "user-leftover.txt" -ErrorAction SilentlyContinue)
          if ($recovered.Count -ne 1) { throw "Unowned old-installation file was not preserved" }
          $uninstallKey = 'SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\{A1B2C3D4-E5F6-7890-ABCD-EF1234567890}_is1'
          $registered = [Microsoft.Win32.Registry]::LocalMachine.OpenSubKey($uninstallKey)
          if ($null -eq $registered) { throw 'Replacement installation has no uninstall entry' }
          try {
            $registeredPath = [IO.Path]::GetFullPath([string]$registered.GetValue('InstallLocation')).TrimEnd('\')
            if ($registeredPath -ne [IO.Path]::GetFullPath($target).TrimEnd('\')) { throw 'Uninstall entry points to the wrong installation' }
            if (-not (Test-Path -LiteralPath ([string]$registered.GetValue('UninstallString')).Trim('"') -PathType Leaf)) { throw 'Replacement uninstaller is missing' }
          } finally { $registered.Dispose() }
          $verify = Start-Process -FilePath (Join-Path $target "LogPro.exe") -ArgumentList '--verify-installation' -WindowStyle Hidden -Wait -PassThru
          if ($verify.ExitCode -ne 0) { throw "Replacement installation failed integrity verification" }

          # No network must leave the bundled baseline healthy and finish setup successfully.
          $offline = [Diagnostics.ProcessStartInfo]::new((Join-Path $target "LogPro.exe"), '--installation-check')
          $offline.UseShellExecute = $false
          $offline.CreateNoWindow = $true
          $offline.Environment['HTTPS_PROXY'] = 'http://127.0.0.1:9'
          $offline.Environment['HTTP_PROXY'] = 'http://127.0.0.1:9'
          $offlineProcess = [Diagnostics.Process]::Start($offline)
          try {
            if (-not $offlineProcess.WaitForExit(60000)) { $offlineProcess.Kill($true); throw 'Offline installation check timed out' }
            if ($offlineProcess.ExitCode -ne 0) { throw "Offline installation check failed: $($offlineProcess.ExitCode)" }
          } finally { $offlineProcess.Dispose() }
          $verify = Start-Process -FilePath (Join-Path $target "LogPro.exe") -ArgumentList '--verify-installation' -WindowStyle Hidden -Wait -PassThru
          if ($verify.ExitCode -ne 0) { throw "Offline fallback damaged bundled tools" }

      - name: Sign Setup.exe
        if: env.SIGN_CERT_PFX != '' && env.SIGN_CERT_PASSWORD != ''
        shell: pwsh
        env:
          SIGN_CERT_PFX: ${{ secrets.SIGN_CERT_PFX }}
          SIGN_CERT_PASSWORD: ${{ secrets.SIGN_CERT_PASSWORD }}
        run: |
          $cert = "$env:RUNNER_TEMP\signing.pfx"
          [IO.File]::WriteAllBytes($cert, [Convert]::FromBase64String($env:SIGN_CERT_PFX))
          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1).FullName
          $exe = Get-Item (Get-ChildItem dist\*.exe | Select-Object -First 1).FullName
          & $signtool sign /fd SHA256 /f $cert /p $env:SIGN_CERT_PASSWORD /tr https://timestamp.digicert.com /td SHA256 $exe.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Setup.exe
        uses: actions/upload-artifact@v7
        with:
          name: setup-exe
          path: dist/*.exe

  release:
    name: GitHub Release
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    needs: [build, installer]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download Installer
        uses: actions/download-artifact@v8
        with:
          name: setup-exe
          path: dist/

      - name: List Assets
        shell: bash
        run: |
          echo "=== Release Assets ==="
          ls -la dist/

      - name: Generate Changelog
        shell: bash
        run: |
          PREV=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          echo "## LogPro v${{ needs.build.outputs.version }}" > CHANGELOG.md
          echo "" >> CHANGELOG.md
          if [ -n "$PREV" ]; then
            git log "$PREV..HEAD" --pretty=format:"- %s" --no-merges >> CHANGELOG.md
          else
            git log --pretty=format:"- %s" --no-merges >> CHANGELOG.md
          fi
          cat CHANGELOG.md

      - name: Create Release with Assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: LogPro v${{ needs.build.outputs.version }}
          body_path: CHANGELOG.md
          files: dist/LogPro_v*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
